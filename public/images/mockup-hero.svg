<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="clip"><rect x="445" y="65" width="310" height="670" rx="38"/></clipPath>
  </defs>

  <!-- soft shadow, fundo segue transparente -->
  <rect x="438" y="58" width="324" height="684" rx="52" fill="#000000" opacity="0.28" filter="url(#shadow)"/>

  <!-- corpo do celular -->
  <rect x="430" y="50" width="340" height="700" rx="52" fill="#020617"/>
  <rect x="430" y="50" width="340" height="700" rx="52" fill="none" stroke="#374151" stroke-width="3"/>
  <rect x="768" y="210" width="5" height="90" rx="2" fill="#374151"/>

  <!-- tela -->
  <rect x="445" y="65" width="310" height="670" rx="38" fill="url(#screen)"/>
  <g clip-path="url(#clip)">
    <!-- notch -->
    <rect x="545" y="78" width="110" height="22" rx="11" fill="#020617"/>

    <!-- título -->
    <text x="600" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Protocolo 21 Dias</text>
    <text x="600" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#4ade80">Dia 7  •  Fase 1</text>

    <!-- cronômetro -->
    <circle cx="600" cy="385" r="128" fill="none" stroke="#1f2937" stroke-width="16"/>
    <circle cx="600" cy="385" r="128" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="201" transform="rotate(-90 600 385)"/>
    <text x="600" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" fill="#ffffff">05:00</text>
    <text x="600" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#4ade80">Contrair</text>

    <!-- progresso -->
    <text x="478" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9ca3af">Progresso</text>
    <text x="722" y="575" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#d1d5db">7 de 21 dias</text>
    <rect x="478" y="590" width="244" height="12" rx="6" fill="#1f2937"/>
    <rect x="478" y="590" width="81" height="12" rx="6" fill="#16a34a"/>

    <!-- abas inferiores -->
    <rect x="445" y="648" width="310" height="2" fill="#1f2937"/>
    <circle cx="497" cy="678" r="5" fill="#6b7280"/>
    <text x="497" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9ca3af">Localizar</text>
    <circle cx="600" cy="678" r="5" fill="#22c55e"/>
    <text x="600" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4ade80">Treino</text>
    <circle cx="703" cy="678" r="5" fill="#6b7280"/>
    <text x="703" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9ca3af">Respiração</text>
  </g>
  <rect x="445" y="65" width="310" height="670" rx="38" fill="none" stroke="#1f2937" stroke-width="2"/>
</svg>